# ============================================================
# SECOM 项目配置文件（可提交到 Git）：凡换值会改变结果的数字与开关都放这里，不埋进代码。
# 密钥类（API key / 内网 url / token）只放 .env，见 .env.example。
# ============================================================

# ---- 全局可复现性 ----
# 全局唯一随机种子：数据划分、模型训练、交叉验证、重采样全部引用它。多线程/BLAS 后端
# 残留的微小数值抖动由回归测试容差 reproducibility.tolerance 兜底。
random_state: 42

# ---- 数据路径 ----
data:
  # 原始数据放在仓库的上一级目录，下载方式见 README 的"准备数据"步骤。
  features_path: "../secom.data"
  labels_path: "../secom_labels.data"
  # 标签时间戳格式
  timestamp_format: "%d/%m/%Y %H:%M:%S"

# ---- 预处理（对应数据特点：高维稀疏 + 大量缺失）----
preprocessing:
  # 缺失值比例超过此阈值的特征直接删除，其余用策略填充。
  drop_missing_threshold: 1.0      # 1.0 = 仅删全空列；调低可更激进地删高缺失特征
  impute_strategy: "median"        # median / mean —— 因数据偏态选中位数
  scale: true                      # StandardScaler 标准化
  # 防泄漏是实现事实而非开关：填充/标准化只在训练集 fit，测试集仅 transform，无第二条链路。

# ---- 特征选择 ----
feature_selection:
  n_features_to_select: 40         # 最终保留的关键特征数
  methods: ["f_test", "mutual_info", "rfe", "random_forest"]  # 参与综合排名的方法
  # 指定一份已保存的特征列表文件（如 outputs/selected_features_full_*.txt）即跳过选择
  # 计算直接用它，用于互信息随机性导致回归超容差时锁定特征；null = 正常计算。
  override_features_path: null

# ---- 业务成本假设（相对值）：期望代价 = FN×fn + FP×fp ----
# 项目唯一的一组成本，三处共用：主流程选 reference 模型、策略对比选工作点、消融报告计代价。
# 必填、无默认值——它直接决定选出哪个模型，静默兜底等于把口径藏进代码。
costs:
  fn: 10.0
  fp: 1.0

# ---- reference 产物的划分（唯一正式产物来源）----
# 它就是下方重采样总体的第 0 个划分：产物与区间同源，无需控制变量。
# 没有 stratify 开关——分层是该协议的定义组成部分，关掉它就是另一个协议。
artifact_split:
  protocol: "stratified_shuffle"
  test_size: 0.2
  seed: 42                         # 与 random_state 同值；显式写出是为与重采样总体共用一个种子

# ---- 评估协议 ----
validation:
  # 重采样总体：R 个 80/20 分层划分，第 0 个即 reference。产出区间与配对差值。
  resample:
    enabled: false                 # 默认关：R=20 串行约 1.5 小时，不进日常运行路径
    n_splits: 20                   # 区间的 R；正式区间口径，改动会使已发布区间失去可比性
    interval: "percentile"         # percentile = 指标分布本身 / bootstrap = 均值的不确定度
    paired_diff: true              # 模型两两比较报配对差值区间（独立区间重叠 ≠ 无差异）
    n_jobs: 4                      # 划分间并行度（本机 4 核）。子进程 BLAS 线程数不同会改变
                                   # 归约次序，折级指标末位可差 ~1e-13；划分 #0 固定在主进程
                                   # 串行重算，故同源断言仍是逐位比较。
  # 时间序留出：另一个总体，与随机协议并列不混（前 80% 训练 / 后 20% 测试）。
  temporal_holdout:
    enabled: true                  # 默认开：只多跑一条划分（约 6 分钟），产物因此永远由当前代码产出
    test_fraction: 0.2
    gap: 0                         # 训练段尾部丢弃的样本数，模拟"上线时最近一批还没有标签"
    prior_drift_bins: 5            # 先验漂移刻画的等样本数分箱数（附录 A-1 的五等分口径）
    # 本协议不提供 stratify：训练段或测试段缺类别即显式失败，不为分层打乱时间顺序。

drift:
  enabled: true
  model: "ridge"
  window_size: 200
  step_size: 100
  psi_bins: 10
  psi_pseudocount: 0.5
  ks_min_samples: 2
  top_features: 10

stability:
  enabled: false
  input_scope: "reference_train_only"
  n_resamples: 20
  test_size: 0.2
  seed: 42
  n_jobs: 4
  frequency_thresholds: [0.6, 0.7, 0.8]
  primary_frequency_threshold: 0.7
  correlation_group_threshold: 0.9
  correlation_statistic: "absolute_spearman"
  correlation_grouping: "connected_components"
  classification:
    exploratory_min_frequency: 0.0
    high_min_direction_consistency: 0.8
    missing_direction: "insufficient_evidence"
  analysis:
    direction_method: "ridge_coefficient"
    direction_alpha: 1.0
    direction_class_weight: "balanced"
    convergence_step: 5

# ---- 类别不平衡（横切关注点：影响建模与评估口径）----
imbalance:
  # 主流程训练策略：none / class_weight。smote / undersample 只在下方 comparison
  # 实验中实现，主流程训练路径未接入，配置这两个值会显式报错而非静默退化。
  strategy: "class_weight"
  # 决策阈值不在此配置：它是某条已拟合链路的属性，配置项无法承载。对比实验选出的工作点
  # 连同整条链路存在 outputs/imbalance_operating_point_<模型>.pkl，用 src.imbalance 的
  # load_operating_point / apply_operating_point 加载部署，加载时做清单核对与产物自检。

  # 折外校准（进对比实验，主流程训练路径没有这一层）：校准器包住整条 Pipeline，
  # 阈值在完全折外的校准概率上按最小期望代价选出。
  calibration:
    method: "sigmoid"              # 主口径，进工作点选择池
    contrast_method: "isotonic"    # 同表对照，只报数字不产交付物；null = 关掉对照
    cv_folds: 5                    # 校准器内层分层 CV 折数（基础分类器与校准器都在折内拟合）

  # 成本敏感性档位（FN:FP 比值，FP 固定为顶层 costs.fp）：只重选阈值，不重训、不重选策略。
  # 顶层 costs 的比值必须在表内——主表与正式 pkl 绑的那一档要能和本表对上。
  cost_sensitivity: [5, 10, 20]

  # 策略对比实验（full 模式）：独立严格链路，填充/标准化/特征选择/重采样封装进 Pipeline
  # 只在训练侧拟合；策略选择只用训练侧 CV 期望代价。产出对比表、PR 曲线与混淆矩阵。
  comparison:
    enabled: true
    strategies: ["baseline", "class_weight", "smote", "undersample", "threshold_moving",
                 "calibrated_threshold", "calibrated_threshold_contrast"]
    models: ["logistic", "random_forest", "ridge"]
    cv_folds: 5                    # 分层 CV 折数（全链路只在训练折内拟合）
    smote_k_neighbors: 5
    # 成本假设见顶层 costs：两处选择必须用同一组，故不在此另设一份。

# ---- 模型 ----
model:
  # 支持模型名、显式列表或"all"；默认列表固定旧三模型回归口径。
  active: ["logistic", "random_forest", "ridge"]
  cv_folds: 10                     # 训练侧 StratifiedKFold 折数，reference 模型按它的折外结果选出
  parameters:
    elasticnet:
      C: 0.1
      l1_ratio: 0.5
      max_iter: 10000
      tol: 0.001
    hist_gradient_boosting:
      learning_rate: 0.1
      max_iter: 100
      max_leaf_nodes: 15
      min_samples_leaf: 20
      l2_regularization: 1.0
      early_stopping: false
    balanced_random_forest:
      n_estimators: 100
      sampling_strategy: "all"
      replacement: true
      bootstrap: false
      n_jobs: 1

model_comparison:
  enabled: false
  input_scope: "reference_train_only"
  reference_model: "ridge"
  delivery_candidates: ["logistic", "ridge", "elasticnet", "hist_gradient_boosting"]
  reference_baselines: ["random_forest", "balanced_random_forest"]
  interval: "percentile"
  primary_metric: "cost_per_wafer"
  replacement_rule: "paired_upper_below_zero"
  n_jobs: 4

# ---- 评估（不平衡场景：以 BER/召回为主，而非准确率）----
evaluation:
  primary_metric: "ber"            # 主指标
  report_metrics: ["ber", "recall", "precision", "f1", "auc", "accuracy"]
  # 固定 FP 预算下的召回：工艺侧每批最多复查这么多片，比 AUC 可执行。
  fp_budget: 20
  # 这里没有"要不要跑训练侧 CV"的开关：reference 模型的选择依赖它，
  # 关得掉的开关意味着选择可以静默失去训练侧依据、退回按测试集挑。

# ---- 可复现性回归校验 ----
reproducibility:
  # 严格链路（唯一链路）的回归锚点：预处理与特征选择只在训练集拟合的那份指标。
  baseline_path: "baseline_metrics_strict.json"
  tolerance: 0.01                  # |new - old| < tolerance 视为一致

# ---- 可解释性（SHAP，仅 full 模式生成）----
explain:
  enabled: true
  required: true                   # true = SHAP 失败使整个流程失败（防"验证假通过"）
  background_size: 100             # SHAP 背景样本数（从训练集抽样，代表总体分布，须 > 0）

# ---- 消融实验（full 模式）：特征选择方式 × 不平衡处理的 2x2 对比 ----
# 独立严格链路，预处理与两种特征选择都只在训练集拟合。
ablation:
  enabled: true
  models: ["logistic", "random_forest", "ridge"]

# ---- 输出 ----
output:
  results_dir: "outputs"           # 生成物目录（已被 .gitignore 忽略）
  log_level: "INFO"                # DEBUG / INFO / WARNING

# ---- 运行模式 ----
run:
  # quick 模式：小样本、跳过耗时步骤（RFE/网格搜索），用于调试和现场演示。
  quick: false
  quick_sample_size: 200
